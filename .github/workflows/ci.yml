name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: ShellCheck
        run: shellcheck -s bash bootstrap.sh install.sh lib/*.sh scripts/*.sh
      - name: Templates are valid JSON
        run: python3 -c "import json; json.load(open('templates/.claude/settings.json'))"
      - name: gitleaks (secret scan, full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact

  preflight:
    runs-on: macos-latest   # Apple Silicon runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bash 3.2 syntax check
        run: for f in bootstrap.sh install.sh lib/*.sh scripts/*.sh; do /bin/bash -n "$f"; done
      - name: Preflight
        run: CI=1 ./bootstrap.sh --only preflight
      - name: Brewfile parses
        run: brew bundle list --file config/Brewfile --all >/dev/null && brew bundle list --file config/Brewfile.extras --all >/dev/null
